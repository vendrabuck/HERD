# Nightly full-stack gate: everything `make everything` runs against a live
# stack that PR CI does not (Selenium e2e and the locust load test), plus a
# second pass of contract + integration without -x so a regression reports the
# full failure set instead of stopping at the first one. workflow_dispatch
# lets a reviewer run this on any branch before merging a frontend-heavy PR.
#
# The first e2e pass (before the LDAP-mode and Postgres-live phases) runs
# against an unseeded stack, so every test gated on an available device skips
# there by design; after "Seed stack for load test" a second pass,
# `make test-e2e-seeded`, re-runs the same suite against the now-seeded stack
# and fails if anything still skips (issue #629).
#
# Runs the NOS lab feature tier too (issue #785): after the seeded e2e pass,
# the checked-in emulated-gear lab (infra/nos-test) is attached to this stack
# and the two via-stack suites drive a real SR Linux and a real FRR node
# through HERD's own reservation path. The cheaper dialect suites, which need
# no stack, run on every PR in ci.yml's nos-dialect job instead.
#
# Also runs the LDAP-mode stack coverage the master/everything gates run
# (issue #572): infra/ldap-test boots alongside the stack, and after e2e the
# stack's auth service is switched to LDAP mode, tests/integration/
# test_ldap_auth.py and test_ldap_sync_admin.py run against it, and every
# Postgres-live suite (services/*/tests/*_live_pg.py) runs against the stack's
# own Postgres, via `make _gate-ldap-stack-tests` / `make _gate-pg-live-tests`
# (the same internal targets master/everything use, see the Makefile's LDAP
# comment block). The job sets COMPOSE_PROJECT_NAME=herd once, in its env block, so
# every step and make target addresses the same compose project (issue #1313).
name: Nightly

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-stack:
    runs-on: ubuntu-latest
    env:
      # The one compose project name for every step: the bare `docker compose`
      # calls, the make targets, and the test code that runs `docker compose`
      # all read it. The NOS and LDAP labs are unaffected: the Makefile pins
      # their projects with -p.
      COMPOSE_PROJECT_NAME: herd
      # Per-test e2e failure artifacts (screenshot, page, console, traceback) are
      # written under this directory by tests/e2e/conftest.py; pointing it into the
      # workspace lets the failure upload below carry them. Without this they land
      # in the runner's temp dir and are lost with the job.
      HERD_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same uv release the service images copy (tests/unit/test_uv_pins.py).
          version: "0.13.7"

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Create CI .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=herd
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=herd
          AUTH_SECRET_KEY=$(openssl rand -hex 32)
          INTERNAL_API_TOKEN=$(openssl rand -hex 32)
          SUPERADMIN_EMAIL=admin@example.com
          SUPERADMIN_USERNAME=admin
          SUPERADMIN_PASSWORD=admin123!
          EOF

      - name: Build images
        run: docker compose build

      - name: Start LDAP test server
        run: make ldap-up

      # The stack starts with a bare `docker compose up`, not `make up`, so the
      # gateway's self-signed certificate is generated here first (issue #1239),
      # as on a fresh clone. Without it Traefik cannot build its default TLS store
      # and answers no TLS handshake at all.
      - name: Generate the gateway TLS certificate
        run: make certs

      - name: Start stack
        run: docker compose up -d

      - name: Wait for stack healthy
        run: make _master-wait-healthy

      - name: Contract tests
        run: make test-contract

      # No -x here (unlike make test-integration): nightly should surface
      # every failure in one run, not stop at the first.
      - name: Integration tests (full failure set)
        run: uv run pytest tests/integration/ -v --timeout=60

      - name: Install Playwright browser deps
        run: uv run playwright install --with-deps chromium

      - name: E2E tests (Selenium + Playwright)
        run: make test-e2e

      - name: LDAP-mode stack tests
        run: make _gate-ldap-stack-tests

      - name: Postgres-live suites (every services/*/tests/*_live_pg.py)
        run: make _gate-pg-live-tests

      - name: Seed stack for load test
        run: make seed

      - name: E2E tests (seeded, no skips allowed)
        run: make test-e2e-seeded

      # NOS lab feature tier (issue #785): the two via-stack suites drive a
      # REAL SR Linux and a REAL FRR node through HERD's own API (reserve,
      # fork save, execution reconcile), which is why they live here and not
      # in PR CI: they need a booted, seeded stack with the lab attached to
      # its network. `make nos-test-feature` attaches the lab, runs
      # `make seed-nos`, runs the suites hard-required, and always detaches.
      # The target finds the stack's network from COMPOSE_PROJECT_NAME, which
      # the job's env block sets to herd (see the header comment).
      #
      # Placement is deliberate, on both sides. AFTER the seeded e2e pass:
      # the L2 suite reuses the `nos-lab-*` devices `make seed-nos` creates
      # and needs the stack already seeded. BEFORE the load test: locust
      # hammers reservations across the whole seeded inventory, and these
      # suites hold real reservations over real devices, so running them
      # alongside it would race for the same ports.
      #
      # The suites authenticate as the stack's superadmin and read the
      # credentials from the ENVIRONMENT, while the "Create CI .env" step
      # above writes them to .env for the stack itself; the env block below
      # is what bridges the two.
      - name: NOS lab feature tests (reservation-driven, real SR Linux and FRR)
        env:
          SUPERADMIN_EMAIL: admin@example.com
          SUPERADMIN_PASSWORD: admin123!
        run: |
          # The FRR node's VRF fixture (ADR 0014 addendum X-G, issue #755) needs
          # the host kernel's vrf and dummy modules; a container cannot load
          # them for itself. Not fatal: without them start.sh boots the node
          # anyway and the VRF feature test skips, rather than taking the other
          # via-stack tests down with it. See docs/NOS_LAB.md.
          sudo modprobe vrf dummy || echo "vrf/dummy modules unavailable; VRF tests will skip"
          make nos-up
          make nos-test-feature

      - name: Load test (locust, headless)
        run: HERD_BASE_URL=https://localhost make test-load

      # Issue #648: this ordering is an invariant in both directions. It must
      # come AFTER every test phase it is meant to cover (an `if: failure()`
      # step is evaluated at its own position in the sequence; if nothing has
      # failed yet by the time the runner reaches it, it is skipped and never
      # revisited, so placing it any earlier would leave later phases -- seed,
      # seeded e2e, load test -- with no diagnostics at all on failure). It
      # must also come BEFORE "Stop LDAP test server": that step runs
      # unconditionally (if: always()) and tears down the ldap-test container
      # regardless of position, so collecting after it would mean an
      # LDAP-phase failure could never show ldap-test's state or logs in the
      # snapshot. Nothing between the Postgres-live phase and the load test
      # needs the LDAP container, so it stays up, unused, until here. Same
      # shared Makefile collector as the CI integration job (_collect-
      # stack-diagnostics), so the two jobs cannot drift apart.
      - name: Collect stack diagnostics
        if: failure()
        run: |
          make _collect-stack-diagnostics
          docker compose -p herd-nos-test -f infra/nos-test/docker-compose.yml \
            logs --tail 400 > nos-lab-logs.txt 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-artifacts
          path: |
            compose-ps.txt
            docker-ps-a.txt
            compose-logs.txt
            logs-*.txt
            nos-lab-logs.txt
            e2e-artifacts/**
          retention-days: 7

      - name: Stop LDAP test server
        if: always()
        run: make ldap-down

      - name: Stop NOS test lab
        if: always()
        run: make nos-down
