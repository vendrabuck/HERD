name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PR branches only. Runs on main always finish:
# a cancelled main run leaves the merge commit unverified (observed 2026-06:
# a push-event run was cancelled at 32s by the next push and never reported).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      # Dependabot's pip-ecosystem PRs bump pyproject.toml specifiers but never
      # regenerate uv.lock, so the committed lock drifts silently until something
      # runs uv (caught by hand in PR #342). Fail loudly instead: --check verifies
      # the lock is up to date with every pyproject in the workspace without
      # modifying it. Runs before uv sync so the failure is fast and the check
      # sees the lockfile exactly as committed.
      - name: Check uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      # Scope mirrors the Makefile's lint/format targets: services/ plus the
      # repo-root Python helper scripts (ROOT_PY), so a style violation in a
      # root script fails CI the same way it fails `make lint` locally.
      - name: Lint
        run: uv run ruff check services/ seed_devices_public.py scripts/check_image_matches_lock.py

      - name: Format check
        run: uv run ruff format --check services/ seed_devices_public.py scripts/check_image_matches_lock.py

      # Image-vs-lock guard (issue #593): every service Dockerfile now installs
      # from `uv export --frozen` instead of resolving dependencies fresh at
      # build time, so `uv lock --check` alone no longer proves what a built
      # image actually contains. Build one representative image (ai-orchestrator,
      # the service that surfaced the original incident: an upstream anthropic
      # 1.0.0 release resolved into a freshly-built image while uv.lock still
      # pinned 0.96.0) and diff its installed third-party packages against the
      # same lock export the Dockerfile itself runs. The only tolerated
      # differences are the two editable workspace packages
      # (herd-ai-orchestrator, herd-common) and the pip bootstrap package;
      # anything else, in either direction, fails the job.
      - name: Build representative image (ai-orchestrator)
        run: docker build -t herd-ci-image-check:ai-orchestrator -f services/ai-orchestrator/Dockerfile .

      - name: Assert image matches uv.lock
        run: |
          uv export --frozen --package herd-ai-orchestrator --no-hashes \
            --no-emit-workspace --no-default-groups --no-header --no-annotate \
            > /tmp/lock-export.txt
          docker run --rm herd-ci-image-check:ai-orchestrator \
            pip list --format=freeze > /tmp/image-installed.txt
          python3 scripts/check_image_matches_lock.py \
            /tmp/lock-export.txt /tmp/image-installed.txt \
            --allow herd-ai-orchestrator --allow herd-common --allow pip

      - name: Remove image-check image
        if: always()
        run: docker rmi herd-ci-image-check:ai-orchestrator || true

      # Single pass: pytest runs once with coverage across every service in the
      # Makefile's SERVICES list (plus the repo-root tests/unit suite via the
      # test-root prerequisite). This is the pass/fail signal AND the artifact
      # source, so a new service is covered automatically with no edit here.
      # -j4 matches the 4 vCPUs on ubuntu-latest; -Otarget keeps each suite's
      # output contiguous so failures stay readable.
      - name: Backend unit tests + coverage (all services)
        run: make -j4 -Otarget coverage-parallel COV_XML=1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-*.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build

  # Stack-backed gate: builds the compose images, boots the full stack, and
  # runs the contract + integration suites that local `make master` covers but
  # PR CI historically skipped (a 502-to-409 contract change once broke an
  # integration test no PR check ran). E2E and load stay in nightly.yml. This
  # job is advisory (not a required status check): requiring it later is a
  # one-line ruleset toggle, no workflow change.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      # Ephemeral stack credentials. Throwaway per run; the integration
      # conftest's SEED_* defaults (admin@example.com / admin123!) match the
      # SUPERADMIN_* bootstrap values below, so the suite self-seeds.
      - name: Create CI .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=herd
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=herd
          AUTH_SECRET_KEY=$(openssl rand -hex 32)
          INTERNAL_API_TOKEN=$(openssl rand -hex 32)
          SUPERADMIN_EMAIL=admin@example.com
          SUPERADMIN_USERNAME=admin
          SUPERADMIN_PASSWORD=admin123!
          EOF

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for stack healthy
        run: make _master-wait-healthy

      - name: Contract tests
        run: make test-contract

      - name: Integration tests
        run: make test-integration

      # Issue #648: a flake that shows only pytest's assertion (the polled
      # notification never arrived) gives no way to tell an ordering bug at
      # boot from a slow cold path apart, and container-state snapshots
      # (a crash-looping or still-starting container) do not show up in a
      # plain log tail at all. Container state plus per-service logs, split
      # into separate files so a reader is not stuck grepping one 2MB blob.
      # The collector itself lives once in the Makefile's
      # _collect-stack-diagnostics target, shared with nightly.yml, so the
      # two cannot drift apart.
      - name: Collect stack diagnostics
        if: failure()
        run: make _collect-stack-diagnostics

      - name: Upload stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-stack-logs
          path: |
            compose-ps.txt
            docker-ps-a.txt
            compose-logs.txt
            logs-*.txt
          retention-days: 7
