name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PR branches only. Runs on main always finish:
# a cancelled main run leaves the merge commit unverified (observed 2026-06:
# a push-event run was cancelled at 32s by the next push and never reported).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      # Dependabot's pip-ecosystem PRs bump pyproject.toml specifiers but never
      # regenerate uv.lock, so the committed lock drifts silently until something
      # runs uv (caught by hand in PR #342). Fail loudly instead: --check verifies
      # the lock is up to date with every pyproject in the workspace without
      # modifying it. Runs before uv sync so the failure is fast and the check
      # sees the lockfile exactly as committed.
      - name: Check uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      # Scope mirrors the Makefile's lint/format targets: services/ plus the
      # repo-root Python in ROOT_PY (the seedtools package and the image-vs-lock
      # guard script), so a style violation there fails CI the same way it fails
      # `make lint` locally.
      - name: Lint
        run: uv run ruff check services/ seedtools/ scripts/check_image_matches_lock.py

      - name: Format check
        run: uv run ruff format --check services/ seedtools/ scripts/check_image_matches_lock.py

      # Image-vs-lock guard (issue #593): every service Dockerfile now installs
      # from `uv export --frozen` instead of resolving dependencies fresh at
      # build time, so `uv lock --check` alone no longer proves what a built
      # image actually contains. Build one representative image (ai-orchestrator,
      # the service that surfaced the original incident: an upstream anthropic
      # 1.0.0 release resolved into a freshly-built image while uv.lock still
      # pinned 0.96.0) and diff its installed third-party packages against the
      # same lock export the Dockerfile itself runs. The only tolerated
      # differences are the two editable workspace packages
      # (herd-ai-orchestrator, herd-common) and the pip bootstrap package;
      # anything else, in either direction, fails the job.
      - name: Build representative image (ai-orchestrator)
        run: docker build -t herd-ci-image-check:ai-orchestrator -f services/ai-orchestrator/Dockerfile .

      - name: Assert image matches uv.lock
        run: |
          uv export --frozen --package herd-ai-orchestrator --no-hashes \
            --no-emit-workspace --no-default-groups --no-header --no-annotate \
            > /tmp/lock-export.txt
          docker run --rm herd-ci-image-check:ai-orchestrator \
            pip list --format=freeze > /tmp/image-installed.txt
          python3 scripts/check_image_matches_lock.py \
            /tmp/lock-export.txt /tmp/image-installed.txt \
            --allow herd-ai-orchestrator --allow herd-common --allow pip

      - name: Remove image-check image
        if: always()
        run: docker rmi herd-ci-image-check:ai-orchestrator || true

      # Single pass: pytest runs once with coverage across every service in the
      # Makefile's SERVICES list (plus the repo-root tests/unit suite via the
      # test-root prerequisite). This is the pass/fail signal AND the artifact
      # source, so a new service is covered automatically with no edit here.
      # -j4 matches the 4 vCPUs on ubuntu-latest; -Otarget keeps each suite's
      # output contiguous so failures stay readable.
      - name: Backend unit tests + coverage (all services)
        run: make -j4 -Otarget coverage-parallel COV_XML=1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-*.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build

  # Stack-backed gate: builds the compose images, boots the full stack, and
  # runs the contract + integration suites that local `make master` covers but
  # PR CI historically skipped (a 502-to-409 contract change once broke an
  # integration test no PR check ran). E2E and load stay in nightly.yml. This
  # job is advisory (not a required status check): requiring it later is a
  # one-line ruleset toggle, no workflow change.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      # Ephemeral stack credentials. Throwaway per run; the integration
      # conftest's SEED_* defaults (admin@example.com / admin123!) match the
      # SUPERADMIN_* bootstrap values below, so the suite self-seeds.
      - name: Create CI .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=herd
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=herd
          AUTH_SECRET_KEY=$(openssl rand -hex 32)
          INTERNAL_API_TOKEN=$(openssl rand -hex 32)
          SUPERADMIN_EMAIL=admin@example.com
          SUPERADMIN_USERNAME=admin
          SUPERADMIN_PASSWORD=admin123!
          EOF

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for stack healthy
        run: make _master-wait-healthy

      - name: Contract tests
        run: make test-contract

      - name: Integration tests
        run: make test-integration

      # Issue #648: a flake that shows only pytest's assertion (the polled
      # notification never arrived) gives no way to tell an ordering bug at
      # boot from a slow cold path apart, and container-state snapshots
      # (a crash-looping or still-starting container) do not show up in a
      # plain log tail at all. Container state plus per-service logs, split
      # into separate files so a reader is not stuck grepping one 2MB blob.
      # The collector itself lives once in the Makefile's
      # _collect-stack-diagnostics target, shared with nightly.yml, so the
      # two cannot drift apart.
      - name: Collect stack diagnostics
        if: failure()
        run: make _collect-stack-diagnostics

      - name: Upload stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-stack-logs
          path: |
            compose-ps.txt
            docker-ps-a.txt
            compose-logs.txt
            logs-*.txt
          retention-days: 7

  # Driver-dialect gate against the checked-in emulated-gear lab
  # (infra/nos-test, docs/NOS_LAB.md): a real Nokia SR Linux node and a real
  # FRRouting node in privileged containers, driven over SSH by the
  # checked-in srl_l2 / frr_l3 / frr_mgmt driver packages. What it proves is
  # exactly what the mock drivers cannot: that a driver speaks its vendor's
  # dialect, walks its prompt state machine, and classifies that vendor's own
  # error wording correctly. No HERD stack is involved, which is why this can
  # run on every PR at all; the two via-stack suites that DO need a booted,
  # seeded stack run in nightly.yml instead (issue #785).
  #
  # Its own job, with no `needs:`, so it runs in parallel with backend,
  # frontend and integration rather than adding its runtime to any of them.
  # Advisory: the branch-protection ruleset requires only `backend` and
  # `frontend`, so a red run here reports but does not block; promoting it to
  # a required check is a ruleset toggle, no workflow change.
  nos-dialect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      # The lab is booted as its own step, not left to nos-test-dialect's
      # boot-if-not-up branch, for one reason: that branch also tears down
      # what it started, and `docker compose down -v` removes the containers,
      # so a failing run would have no logs left to collect. Booting here
      # sends nos-test-dialect down its already-running branch, which leaves
      # the lab up for the diagnostics step below; the always-step at the end
      # of the job is what stops it. The runner allows the privileged
      # containers SR Linux needs.
      # The FRR node's VRF fixture (ADR 0014 addendum X-G, issue #755) needs
      # the host kernel's vrf and dummy modules: a container cannot load them
      # for itself, and the runner image does not carry them loaded, so
      # infra/nos-test/frr/start.sh would otherwise report "Unknown device
      # type" and the VRF tests would skip. Not `set -e`-fatal on purpose: if a
      # future runner image drops the modules entirely, this job should still
      # run the other three dialect suites rather than go red over a host
      # capability they do not need.
      - name: Load the VRF kernel modules the lab fixture needs
        run: sudo modprobe vrf dummy || echo "vrf/dummy modules unavailable; VRF tests will skip"

      - name: Start NOS test lab
        run: make nos-up

      # Runs the four dialect suites hard-required: HERD_TEST_NOS_REQUIRED=1
      # turns an unreachable lab into a failure instead of the suites' normal
      # skip, so this job can never silently no-op.
      - name: NOS lab dialect tests
        run: make nos-test-dialect

      - name: Collect NOS lab logs
        if: failure()
        run: |
          docker compose -p herd-nos-test -f infra/nos-test/docker-compose.yml \
            logs --tail 400 > nos-lab-logs.txt 2>&1 || true

      - name: Upload NOS lab logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nos-dialect-logs
          path: nos-lab-logs.txt
          retention-days: 7

      - name: Stop NOS test lab
        if: always()
        run: make nos-down
