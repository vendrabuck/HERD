name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      # Scope mirrors the Makefile's lint/format targets: services/ plus the
      # repo-root Python helper scripts (ROOT_PY), so a style violation in a
      # root script fails CI the same way it fails `make lint` locally.
      - name: Lint
        run: uv run ruff check services/ seed_devices_public.py

      - name: Format check
        run: uv run ruff format --check services/ seed_devices_public.py

      # Single pass: pytest runs once with coverage across every service in the
      # Makefile's SERVICES list. This is the pass/fail signal AND the artifact
      # source, so a new service is covered automatically with no edit here.
      - name: Backend unit tests + coverage (all services)
        run: make coverage COV_XML=1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-*.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build
