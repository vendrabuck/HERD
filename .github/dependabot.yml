version: 2
updates:
  # The uv ecosystem reads the root pyproject.toml workspace and regenerates
  # uv.lock in the same pull request, which the pip ecosystem never did.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images in every Dockerfile. Dependabot reads FROM lines only, which is
  # why the service Dockerfiles take the uv binary from a named stage.
  - package-ecosystem: "docker"
    directories:
      - "/services/*"
      - "/frontend"
      - "/infra/nos-test/frr"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Images named by `image:` in the compose files.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/infra/ldap-test"
      - "/infra/nos-test"
    schedule:
      interval: "weekly"
    groups:
      compose-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
