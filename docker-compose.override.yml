services:
  config:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Dev/test/ephemeral stacks pin the config-page password to the historically
    # documented value so the e2e/integration seed flow can log in and write; it
    # also marks the surface rotated (unlocked). This override is excluded by
    # `make prod`, so production falls back to the random one-time password
    # (issue #256).
    environment:
      - CONFIG_ADMIN_PASSWORD=admin123!
    volumes:
      - ./services/config/app:/app/app
      - herd-config:/data/herd-config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  auth:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/auth/app:/app/app
      - ./services/common/herd_common:/app/common/herd_common

  inventory:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Dev/test-only fault-injection seam (issue #214). Enables the double-gated
    # hook in update_device_status_internal; harmless unless a device name also
    # carries the __herd_fault_status__ sentinel. This override file is excluded
    # by `make prod` (docker compose -f docker-compose.yml), so prod never sees it.
    environment:
      - HERD_FAULT_INJECTION=1
    volumes:
      - ./services/inventory/app:/app/app
      - ./services/inventory/migrations:/app/migrations
      - ./services/common/herd_common:/app/common/herd_common
      - driver-storage:/data/drivers

  reservations:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/reservations/app:/app/app
      - ./services/common/herd_common:/app/common/herd_common

  integration:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # Test-only webhook delivery sink, dev/test stack only (never in make prod,
      # which excludes this override). Mirrors the HERD_FAULT_INJECTION seam.
      WEBHOOK_TEST_SINK_ENABLED: "true"
    volumes:
      - ./services/integration/app:/app/app
      - ./services/common/herd_common:/app/common/herd_common

  secrets:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # Dev/test-only KEK so the ephemeral stack boots without setup (never in
      # make prod, which excludes this override; prod refuses to boot without a
      # real SECRETS_KEK in .env). Mirrors the WEBHOOK_TEST_SINK_ENABLED seam.
      SECRETS_KEK: ${SECRETS_KEK:-aGVyZC1kZXYtc3RhY2sta2VrLTMyLWJ5dGVzLW9rISE=}
    volumes:
      - ./services/secrets/app:/app/app
      - ./services/common/herd_common:/app/common/herd_common

  cabling:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/cabling/app:/app/app
      - ./services/common/herd_common:/app/common/herd_common

  execution:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/execution/app:/app/app
      - ./services/common/herd_common:/app/common/herd_common
      - driver-cache:/data/driver-cache

  ai-orchestrator:
    # Pinned CA for a self-signed openai_compat endpoint (e.g. an on-prem vLLM).
    # Dev/demo-only: kept out of the base compose so it does not reference a
    # gitignored file. Set AI_CA_CERT=/certs/spark-ca.pem to use it.
    volumes:
      - ./spark-ca.pem:/certs/spark-ca.pem:ro

  traefik:
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      - "--log.level=DEBUG"

  selenium:
    image: selenium/standalone-chrome:latest
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_SESSION_REQUEST_TIMEOUT=300
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2g
    networks:
      - herd-net
    profiles:
      - e2e

volumes:
  driver-storage:
  driver-cache:
  herd-config:

networks:
  herd-net:
