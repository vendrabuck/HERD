[project]
name = "herd-common"
version = "0.8.0.dev0"
description = "Shared utilities for HERD services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "pyjwt>=2.15.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herd_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # pytest-asyncio 1.4 warns at configure time that this option is unset. Setting
    # it would change the loop of every session-scoped async fixture in
    # tests/integration (unset keeps each fixture's own caching scope), so only the
    # warning is ignored, by its exact text, until those fixtures name loop_scope.
    'ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning',
]
