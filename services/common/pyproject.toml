[project]
name = "herd-common"
version = "0.3.0"
description = "Shared utilities for HERD services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "python-jose[cryptography]>=3.3.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herd_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
