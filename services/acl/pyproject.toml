[project]
name = "herd-acl"
version = "0.8.0.dev0"
description = "HERD ACL Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "herd-common",
]

[tool.uv.sources]
herd-common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # pytest-asyncio 1.4 warns at configure time that this option is unset. Setting
    # it would change the loop of every session-scoped async fixture in
    # tests/integration (unset keeps each fixture's own caching scope), so only the
    # warning is ignored, by its exact text, until those fixtures name loop_scope.
    'ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning',
]
