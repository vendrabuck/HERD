[project]
name = "herd-reservations"
version = "0.3.0.dev0"
description = "HERD Reservations Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "nats-py>=2.7.0",
    "herd-common",
]

[tool.uv.sources]
herd-common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
# FastAPI endpoint handlers run inside anyio worker threads under
# ASGITransport, and SQLAlchemy's async engine drives them through greenlets.
# Without tracing both, coverage records only the first line of each async
# handler and the per-line result is order dependent, so async router lines
# read as uncovered even when a passing test exercises them. Tracing thread
# and greenlet contexts makes router coverage accurate and stable.
concurrency = ["thread", "greenlet"]
