[project]
name = "herd-ai-orchestrator"
version = "0.3.0.dev0"
description = "HERD AI Orchestrator Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0,<1",
    "openai>=1.55.0",
    "pdfplumber>=0.11.0",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "herd-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
herd-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
