[project]
name = "herd-execution"
version = "0.2.0"
description = "HERD Execution Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "nats-py>=2.7.0",
    # netmiko (pulls paramiko) gives SSH drivers real network-CLI handling:
    # config-mode entry, prompt detection, and per-vendor platforms. pip install
    # is gated off in the driver sandbox, so the SSH client must live in the
    # execution image, not in a driver package zip.
    "netmiko>=4.3.0",
    "herd-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
herd-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
