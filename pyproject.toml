[tool.uv.workspace]
members = [
    "services/common",
    "services/auth",
    "services/inventory",
    "services/reservations",
    "services/acl",
    "services/user-profile",
    "services/cabling",
    "services/execution",
    "services/config",
    "services/ai-orchestrator",
    "services/notifications",
    "services/integration",
    "services/secrets",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pip-audit>=2.10.1",
    "selenium>=4.46.0",
    "playwright>=1.49.0",
    "pytest-timeout>=2.4.0",
    "locust>=2.45.0",
]
