[tool.uv.workspace]
members = [
    "services/common",
    "services/auth",
    "services/inventory",
    "services/reservations",
    "services/acl",
    "services/user-profile",
    "services/cabling",
    "services/execution",
    "services/config",
    "services/ai-orchestrator",
    "services/notifications",
    "services/integration",
    "services/secrets",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "seeded_skip_ok(reason): skip is expected even on a seeded stack (issue #629)",
    "ai_model: asserts a model's own tool-call choices against a live provider; runs only in the separate, no-fail-fast invocation (issue #1270)",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pip-audit>=2.10.1",
    "selenium>=4.52.0",
    "playwright>=1.64.1",
    "pytest-timeout>=2.4.0",
    "locust>=2.47.0",
]
