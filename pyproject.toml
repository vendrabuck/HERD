[tool.uv.workspace]
members = [
    "services/common",
    "services/auth",
    "services/inventory",
    "services/reservations",
    "services/acl",
    "services/user-profile",
    "services/cabling",
    "services/execution",
    "services/config",
    "services/ai-orchestrator",
    "services/notifications",
    "services/integration",
    "services/secrets",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # pytest-asyncio 1.4 warns at configure time that this option is unset. Setting
    # it would change the loop of every session-scoped async fixture in
    # tests/integration (unset keeps each fixture's own caching scope), so only the
    # warning is ignored, by its exact text, until those fixtures name loop_scope.
    'ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning',
]
markers = [
    "seeded_skip_ok(reason): skip is expected even on a seeded stack (issue #629)",
    "ai_model: asserts a model's own tool-call choices against a live provider; runs only in the separate, no-fail-fast invocation (issue #1270)",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pip-audit>=2.10.1",
    "selenium>=4.52.0",
    "playwright>=1.64.1",
    "pytest-timeout>=2.4.0",
    "locust>=2.47.0",
]
