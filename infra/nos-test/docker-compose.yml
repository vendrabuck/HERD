# Checked-in emulated-gear test lab (phase 0 of the emulated-gear test tier,
# ADR 0010): a license-free, no-external-host network-OS
# lab that proves driver dialects against real network operating systems
# rather than the deterministic mock drivers. See docs/NOS_LAB.md.
#
# Two nodes:
#   srl  - Nokia SR Linux, the Layer 2 target (netmiko device_type nokia_srl)
#   frr  - FRRouting with SSH-to-vtysh, the Layer 3 / Cisco-dialect target
#          (netmiko device_type cisco_ios)
#
# Deliberately stateless, like infra/ldap-test/: no named volumes, so
# `docker compose down` discards all node state and the next `up` reboots
# both nodes from a clean image and reapplies the checked-in baseline. This
# is the whole point of the lab: a developer (or CI, once wired in) always
# gets the same starting state, and a broken run is fixed by `make nos-reset`
# rather than by hand-repairing a stateful container.
#
# Both services need `privileged: true`: SR Linux manages its own network
# namespaces and interfaces at boot, and FRR's zebra/staticd daemons program
# the kernel routing table and need raw-socket access neither works under an
# unprivileged container on this host.

name: herd-nos-test

networks:
  nos-test:
    name: herd-nos-test-net

# Container log rotation (issue #1352): Docker's json-file driver, at most five
# files of 10 MB per container (50 MB in all), oldest dropped first. Every
# service references this anchor; tests/unit/test_compose_capacity.py fails on a
# service without it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  srl:
    logging: *default-logging
    # Pinned 2026-09-12 (issue #783): this is the exact build that booted
    # nos-test-srl (org.opencontainers.image.version label 26.7.2-519,
    # confirmed against ghcr.io). The drivers' rejection classification keys
    # on exact SR Linux wording ("% Refusing to remove a non-existent
    # route", "Parsing error:"), and docs/NOS_LAB.md promises "the same
    # starting state" on every `make nos-reset`; an unpinned `latest` could
    # silently change either. To bump: pull the new `latest`,
    # `docker image inspect ghcr.io/nokia/srlinux:latest --format
    # '{{index .RepoDigests 0}} {{.Config.Labels}}'` for the digest and
    # version label, re-verify the baseline and driver wording still match
    # live, then update both the tag and the digest here.
    image: ghcr.io/nokia/srlinux:26.7.2-519@sha256:0096fe3ebcafabb7253492e2060425fe027a168e0e066766d1e85efbb0b48be8
    container_name: nos-test-srl
    hostname: srl
    privileged: true
    user: "0"
    networks:
      - nos-test
    # The stock entrypoint boots sr_linux directly; it never applies our
    # baseline. Replace it with our own start.sh (mounted below), which
    # starts sr_linux the same way, waits for sr_cli to answer, then pipes
    # the baseline into sr_cli on stdin. `sudo bash -c "..."` is the base
    # command verified to work against this image; do not replace it with a
    # plain `bash -c` or the daemon fails to acquire the privileges it needs.
    command: ["sudo", "bash", "-c", "/etc/opt/srlinux/start.sh"]
    volumes:
      - ./srl/start.sh:/etc/opt/srlinux/start.sh:ro
      - ./srl/baseline.cli:/etc/opt/srlinux/baseline.cli:ro
      - ./srl/ssh_ready.sh:/etc/opt/srlinux/ssh_ready.sh:ro
    ports:
      - "${HERD_TEST_SRL_PORT:-2223}:22"
    healthcheck:
      # Proves the BASELINE LANDED, not merely that sr_cli answers: the
      # saved startup config must exist (the `save startup` step that clears
      # the [FACTORY] prompt tag, see start.sh) and the LAST setting the
      # baseline applies, ethernet-1/2 vlan-tagging, must read back true.
      # Checking the last-applied setting (not the first) means a healthy
      # result implies the whole baseline ran to completion, the same
      # reasoning infra/ldap-test/docker-compose.yml uses for its own
      # last-fixture healthcheck probe.
      #
      # NOTE: no "-c" flag on sr_cli here. "-c" means "--commit-at-end", not
      # "run this command"; passing the info command as a bare positional
      # argument is the correct non-interactive, single-shot form. "-c"
      # made this exit 1 on a "Parsing error: Unknown token 'commit'" even
      # when the info output itself was correct (verified live).
      #
      # Then, issue #1263, it proves SSH WORKS: ssh_ready.sh (mounted above)
      # must read an "SSH-" version banner from port 22. The baseline check
      # alone never opened an SSH connection, so `make nos-up` (`--wait`)
      # could return while sshd still reset new connections during the banner
      # exchange, and the first SR Linux dialect test failed with
      # ConnectionResetError on a node reported healthy. A banner read rather
      # than the FRR node's `nc -z`, because a socket that listens and then
      # resets on connect is exactly that failure, and a port check passes it.
      # The script's header says which namespaces and addresses it tries and
      # which binaries it relies on.
      test:
        [
          "CMD-SHELL",
          "test -f /etc/opt/srlinux/config.json && sr_cli 'info /interface ethernet-1/2 vlan-tagging' | grep -q true && bash /etc/opt/srlinux/ssh_ready.sh 22",
        ]
      # The budget below is deliberately generous because SR Linux's own boot
      # time (loading its many internal manager processes before sr_cli
      # answers at all, well before start.sh applies the baseline) VARIES
      # WIDELY on the same host: a cold `make nos-reset` was measured at 22s,
      # while an earlier run on a busier host measured minutes. Since that
      # spread is not understood, the retries are sized for the slow case, so
      # a slow boot waits rather than failing the lab spuriously. The cost is
      # that a genuinely broken node takes several minutes to report failure;
      # if that becomes annoying, lower `retries`, do not lower `interval`.
      interval: 5s
      timeout: 10s
      retries: 100
      start_period: 30s

  frr:
    logging: *default-logging
    build:
      context: ./frr
    container_name: nos-test-frr
    hostname: frr
    privileged: true
    networks:
      - nos-test
    ports:
      - "${HERD_TEST_FRR_PORT:-2224}:22"
    healthcheck:
      # Proves vtysh is actually usable over the daemons FRR just started,
      # not just that sshd is listening: a container whose zebra/staticd
      # sockets are not up yet lets you SSH in but then fails vtysh with
      # "failed to connect to any daemons". The `nc -z` probe (issue #783)
      # closes the other gap: start.sh's own `set -e` plus sshd check
      # already stops the container on a dead sshd at boot, but this
      # healthcheck also catches sshd dying LATER, after boot succeeded,
      # when vtysh alone would still report healthy.
      test: ["CMD-SHELL", "vtysh -c 'show version' >/dev/null 2>&1 && nc -z localhost 22"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
