# Checked-in LDAP test directory for the live-LDAP auth tests
# (services/auth/tests/test_ldap_service_live.py) and the master/everything
# gate's LDAP phase.
#
# The osixia image creates the dc=company,dc=local base entry itself from
# LDAP_DOMAIN and the cn=admin bind account from LDAP_ADMIN_PASSWORD; the
# mounted LDIF in ./ldif adds ou=people and the fixture users the tests
# assert (user1..user25 / Password1), plus the ou=groups fixtures for the
# ADR 0011 group-sync tests (60-seed-groups.ldif), plus dedicated ldapit-*
# identities and their own directory group for the stack-level integration
# tests (70-seed-integration.ldif, issue #572: the seeded userN/herd-eng
# fixtures collide with a `make seed`-seeded stack's local users).
# --copy-service is required for the bootstrap LDIF mount to be picked up.
#
# Deliberately stateless: no named volumes, so `docker compose down` discards
# the directory and the next `up` reseeds it from the LDIF. Plain LDAP on
# port 389 only (LDAP_TLS false); the tests bind without TLS.

name: herd-ldap-test

services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-test
    command: [--copy-service]
    environment:
      LDAP_ORGANISATION: "Company Local Test Directory"
      LDAP_DOMAIN: "company.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
    ports:
      - "${HERD_TEST_LDAP_PORT:-389}:389"
    volumes:
      - ./ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    healthcheck:
      # Probes the LAST entry of the LAST bootstrap LDIF file (they apply
      # sequentially in filename order against a running slapd), so healthy
      # means fully seeded, not merely that slapd answers or that an earlier
      # file has landed. That entry is cn=herd-it-eng, the last group in
      # 70-seed-integration.ldif (issue #572); it was cn=herd-stale, from
      # 60-seed-groups.ldif, before that file existed.
      test:
        [
          "CMD",
          "ldapsearch",
          "-x",
          "-H",
          "ldap://localhost",
          "-b",
          "ou=groups,dc=company,dc=local",
          "-D",
          "cn=admin,dc=company,dc=local",
          "-w",
          "admin",
          "(cn=herd-it-eng)",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
