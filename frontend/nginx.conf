server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress favicon.ico errors (app uses /herd.svg)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    # An API path reaches this server only when no service router claims it:
    # Traefik routes each /api/<service> prefix to its service and drops that
    # route while the service's container is stopped or unhealthy, so the
    # request falls through to this catch-all. Answer it as an API would, a
    # 503 with a JSON detail, never the SPA's index.html: a 200 HTML page read
    # as API data crashed the pages that expect a list (issue #1320). `^~`
    # keeps the static-asset regex below from claiming an /api path that
    # happens to end in .js or .svg.
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail": "This part of HERD is not answering right now. Try again in a moment."}';
    }

    # SPA fallback: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
